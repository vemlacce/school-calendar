<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Школьный календарь</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f4f7);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #111111);
      --hint-color: var(--tg-theme-hint-color, #8e8e93);
      --button-color: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --border-color: rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Шапка */
    .header {
      padding: 16px;
      text-align: center;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 12px;
      color: var(--hint-color);
      margin-top: 2px;
    }

    /* Панель фильтров */
    .controls {
      padding: 12px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 14px;
      font-weight: 600;
      outline: none;
    }

    .chips-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .chips-scroll::-webkit-scrollbar { display: none; }

    .chip {
      padding: 6px 14px;
      border-radius: 18px;
      border: none;
      background-color: var(--bg-color);
      color: var(--hint-color);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background-color: var(--button-color);
      color: var(--button-text);
    }

    /* Контейнер событий */
    .events-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .date-group {
      margin-bottom: 20px;
    }

    .date-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--hint-color);
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .event-card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .event-title {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.3;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-exams { background: #ffe3e3; color: #dc2626; }
    .badge-holidays { background: #dcfce7; color: #16a34a; }
    .badge-general { background: #e0f2fe; color: #0284c7; }

    .event-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: var(--hint-color);
      margin-top: 8px;
      font-weight: 500;
    }

    .class-tag {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .event-desc {
      font-size: 13px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      line-height: 1.4;
      opacity: 0.85;
    }

    .empty-state {
      text-align: center;
      color: var(--hint-color);
      padding: 60px 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">📅 Календарь событий</div>
    <div class="subtitle">72. Rīgas vidusskola</div>
  </div>

  <div class="controls">
    <!-- Выпадающее меню классов (заполняется автоматически) -->
    <select id="classFilter" onchange="applyFilters()">
      <option value="all">Все классы</option>
    </select>

    <!-- Фильтры по категориям -->
    <div class="chips-scroll">
      <button class="chip active" data-cat="all" onclick="setCategory('all', this)">Все</button>
      <button class="chip" data-cat="exams" onclick="setCategory('exams', this)">Экзамены</button>
      <button class="chip" data-cat="holidays" onclick="setCategory('holidays', this)">Праздники</button>
      <button class="chip" data-cat="general" onclick="setCategory('general', this)">Общие</button>
    </div>
  </div>

  <div class="events-container" id="eventsList">
    <div class="empty-state">Загрузка мероприятий...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let allEvents = [];
    let selectedCategory = 'all';

    async function loadEvents() {
      try {
        const response = await fetch('./calendar_data.json?t=' + Date.now());
        if (!response.ok) throw new Error(" Ошибка загрузки ");
        
        allEvents = await response.json();
        populateClassDropdown();
        applyFilters();
      } catch (e) {
        console.error(e);
        document.getElementById('eventsList').innerHTML = 
          '<div class="empty-state">Не удалось загрузить события</div>';
      }
    }

    function populateClassDropdown() {
      const select = document.getElementById('classFilter');
      const classesSet = new Set();

      // Собираем все уникальные классы, которые распознала функция parse_classes
      allEvents.forEach(ev => {
        if (ev.classes && Array.isArray(ev.classes)) {
          ev.classes.forEach(c => classesSet.add(c));
        }
      });

      const sortedClasses = Array.from(classesSet).sort((a, b) => {
        const numA = parseInt(a), numB = parseInt(b);
        return numA === numB ? a.localeCompare(b) : numA - numB;
      });

      let optionsHtml = '<option value="all">Все классы</option>';
      sortedClasses.forEach(c => {
        optionsHtml += `<option value="${c}">${c} класс</option>`;
      });

      select.innerHTML = optionsHtml;
    }

    function setCategory(cat, el) {
      selectedCategory = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      applyFilters();
    }

    function applyFilters() {
      const selectedClass = document.getElementById('classFilter').value;

      const filtered = allEvents.filter(ev => {
        const matchCat = (selectedCategory === 'all' || ev.category === selectedCategory);
        
        let matchClass = true;
        if (selectedClass !== 'all') {
          // Если у события нет классов — показываем для всех, либо проверяем совпадение
          matchClass = !ev.classes || ev.classes.length === 0 || ev.classes.includes(selectedClass);
        }

        return matchCat && matchClass;
      });

      renderGroupedEvents(filtered);
    }

    function renderGroupedEvents(events) {
      const container = document.getElementById('eventsList');
      if (events.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет событий для выбранного класса</div>';
        return;
      }

      events.sort((a, b) => new Date(a.start) - new Date(b.start));

      const groups = {};
      events.forEach(ev => {
        const dateObj = new Date(ev.start);
        const dateKey = dateObj.toLocaleDateString('ru-RU', {
          day: 'numeric',
          month: 'long',
          weekday: 'short'
        });
        if (!groups[dateKey]) groups[dateKey] = [];
        groups[dateKey].push(ev);
      });

      let html = '';
      for (const [dateTitle, groupEvents] of Object.entries(groups)) {
        html += `<div class="date-group"><div class="date-title">${dateTitle}</div>`;
        
        groupEvents.forEach(ev => {
          const startTime = new Date(ev.start).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
          const badgeText = ev.category === 'exams' ? 'Экзамен' : (ev.category === 'holidays' ? 'Праздник' : 'Событие');
          const classesStr = (ev.classes && ev.classes.length) ? ev.classes.join(', ') : 'Все';

          html += `
            <div class="event-card">
              <div class="card-top">
                <div class="event-title">${ev.title}</div>
                <span class="badge badge-${ev.category}">${badgeText}</span>
              </div>
              <div class="event-meta">
                <span>🕒 ${startTime}</span>
                <span>🎓 <span class="class-tag">${classesStr}</span></span>
                ${ev.location ? `<span>📍 ${ev.location}</span>` : ''}
              </div>
              ${ev.description ? `<div class="event-desc">${ev.description}</div>` : ''}
            </div>
          `;
        });

        html += `</div>`;
      }

      container.innerHTML = html;
    }

    loadEvents();
  </script>
</body>
</html>
