<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Школьный календарь</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      /* Автоматическая адаптация под тему Telegram */
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --hint-color: var(--tg-theme-hint-color, #888888);
    }

    * {
      box-sizing: border-box;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Шапка приложения */
    .header {
      padding: 12px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      background-color: var(--bg-color);
      flex-shrink: 0;
    }

    .subtitle {
      font-size: 12px;
      font-weight: normal;
      color: var(--hint-color);
      margin-top: 2px;
    }

    /* Контейнер для календаря */
    .calendar-container {
      flex-grow: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    📅 Расписание и мероприятия
    <div class="subtitle">72. Rīgas vidusskola</div>
  </div>

  <div class="calendar-container">
    <!-- Параметры в URL скрывают лишние элементы Google для чистого вида -->
    <iframe src="https://calendar.google.com/calendar/embed?src=r72.vidusskola%40gmail.com&ctz=Europe%2FRiga&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=1&showCalendars=0&showTz=0"></iframe>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    
    // Сообщаем Telegram, что WebApp готов
    tg.ready();
    
    // Раскрываем окно на весь экран
    tg.expand();

    // Устанавливаем цвет верхней плашки Telegram в тон теме
    if (tg.setHeaderColor) {
      tg.setHeaderColor('secondary_bg_color');
    }
  </script>
</body>
</html>
