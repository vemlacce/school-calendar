<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Школьный календарь</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #ffffff);
      --text-color: var(--tg-theme-text-color, #222222);
      --hint-color: var(--tg-theme-hint-color, #888888);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
    }

    * { box-sizing: border-box; }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 12px 16px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      background-color: var(--bg-color);
    }

    .subtitle {
      font-size: 12px;
      font-weight: normal;
      color: var(--hint-color);
      margin-top: 2px;
    }

    .filters {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background-color: var(--bg-color);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .filter-btn {
      padding: 6px 12px;
      border-radius: 16px;
      border: none;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .filter-btn.active {
      background-color: var(--button-color);
      color: var(--button-text-color);
    }

    .events-list {
      flex-grow: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .event-card {
      background-color: var(--secondary-bg);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }

    .event-title {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .event-time {
      font-size: 12px;
      color: var(--hint-color);
      margin-bottom: 6px;
    }

    .event-desc {
      font-size: 13px;
      line-height: 1.4;
    }

    .empty-state {
      text-align: center;
      color: var(--hint-color);
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    📅 Мероприятия и расписание
    <div class="subtitle">72. Rīgas vidusskola</div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="filterEvents('all')">Все</button>
    <button class="filter-btn" onclick="filterEvents('exams')">Экзамены / Мониторинги</button>
    <button class="filter-btn" onclick="filterEvents('holidays')">Праздники</button>
    <button class="filter-btn" onclick="filterEvents('general')">Общие</button>
  </div>

  <div class="events-list" id="eventsList">
    <div class="empty-state">Загрузка мероприятий...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let allEvents = [];
    let currentFilter = 'all';

    async function loadEvents() {
      try {
        // Чтение JSON, который бот автоматически загружает на GitHub Pages
        const response = await fetch('./calendar_data.json?t=' + Date.now());
        if (!response.ok) throw new Error(" Ошибка загрузки ");
        
        allEvents = await response.json();
        renderEvents();
      } catch (e) {
        console.error(e);
        document.getElementById('eventsList').innerHTML = 
          '<div class="empty-state">Не удалось загрузить мероприятия</div>';
      }
    }

    function filterEvents(category) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderEvents();
    }

    function renderEvents() {
      const container = document.getElementById('eventsList');
      const filtered = currentFilter === 'all' 
        ? allEvents 
        : allEvents.filter(ev => ev.category === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">Нет событий в этой категории</div>';
        return;
      }

      container.innerHTML = filtered.map(ev => {
        const dateStr = new Date(ev.start).toLocaleString('ru-RU', {
          day: 'numeric',
          month: 'long',
          hour: '2-digit',
          minute: '2-digit'
        });

        return `
          <div class="event-card">
            <div class="event-title">${ev.title}</div>
            <div class="event-time">🗓 ${dateStr}</div>
            ${ev.description ? `<div class="event-desc">${ev.description}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // Запускаем загрузку при открытии
    loadEvents();
  </script>
</body>
</html>
